function isSantiAgenda(x){const t=(x.type||'').toLowerCase(),o=(x.organ_activity||'').toLowerCase(),d=(x.detail||'').toLowerCase();if(t==='vencimiento')return d.startsWith('santi')||d.startsWith('santiago');if(o.includes('grupo popular')||o.includes('grupo parlamentario')||o.includes('reunión de grupo')||d.includes('reunión de grupo'))return true;if(t.includes('pleno'))return true;const text=o+' '+d;return (t.includes('comisión')||t.includes('visita')||t.includes('jornada')||t.includes('reunión'))&&SANTI_AREAS.some(k=>text.includes(k))}

 const agendaHtml=agendaAll.length?agendaAll.slice(0,14).map(x=>`<div class="row"><div class="date">${fmtDate(x.event_date)}\n${esc(x.event_time||'')}</div><div><b>${esc(x.detail||x.organ_activity)}</b><small>${esc(x.organ_activity)}${x.location?' · '+esc(x.location):''}</small></div></div>`).join(''):`<div class="empty">No hay citas del grupo en los próximos 7 días.</div>`;
 const answered=x=>/respond|contestad|respuesta recibida|finalizad|cerrad/i.test(x.situacion||'');
 const open=initiativeItems.filter(x=>!answered(x)).length,done=initiativeItems.filter(answered).length;
 const initHtml=initiativeItems.slice(0,10).map(x=>`<div class="home-init-row"><div class="home-init-main"><span class="home-init-exp">${esc(String(x.expediente||'').replaceAll('\\','/'))}</span><div class="home-init-text"><b>${esc(x.titulo||'')}</b><small><b>${esc(x.parlamentario||'Sin asignar')}</b></small></div></div><span class="${answered(x)?'answered':'status'}">${answered(x)?'CONTESTADA':'ABIERTA'}</span></div>`).join('');
 const radarAll=radarItems.filter(x=>x.fecha&&x.fecha>=plusDaysISO(hoy,-4)&&x.fecha<=hoy&&!localStorage.getItem('gpvRadarDismissed:'+x.id)).sort((a,b)=>b.fecha.localeCompare(a.fecha));
 const radarHtml=radarAll.length?radarAll.slice(0,8).map(x=>`<div class="radarbody"><span class="radartag">RADAR</span><span class="radardate">${esc(fmtDate(x.fecha))}</span><h4>${esc(x.titulo)}</h4><div class="meta"><b>${esc(x.parlamentario||'Sin asignar')}</b></div><p>${esc(x.resumen||'')}</p></div>`).join(''):`<div class="empty">No hay asuntos recientes en el Radar.</div>`;
 return `<div class="pageintro"><h2>Panel general</h2><p>Visión de conjunto del Grupo Popular Vasco</p></div>${card('AGENDA · TODO EL GRUPO','Próximos 7 días',agendaHtml)}${card('INICIATIVAS · TODO EL GRUPO',`${open} abiertas · ${done} contestadas`,`<div class="home-init-list">${initHtml}</div><div class="extlinks"><button class="linkbtn" data-go="Iniciativas">→ Ver iniciativas</button></div>`)}${bopv()}${card('RADAR · TODO EL GRUPO',`${radarAll.length} asuntos recientes`,radarHtml)}`
}
function inicio(){return `${agenda(false)}${solicitudes()}${bopv()}${radarHome()}${tareasHome()}`}
function tareas(){let out=`<div class="taskhead"><h2>Tareas</h2><button id="newTask">＋ Nueva</button></div>`;['Urgente','Pronto','Cuando pueda'].forEach(p=>{const a=tasks.filter(x=>x.priority===p&&!x.done);if(a.length)out+=`<h3 class="group-title">${p.toUpperCase()} · ${a.length}</h3><div class="taskbox">${a.map(taskHTML).join('')}</div>`});const done=tasks.filter(x=>x.done);if(done.length)out+=`<h3 class="group-title">COMPLETADAS · ${done.length}</h3><div class="taskbox">${done.map(taskHTML).join('')}</div>`;return out}
function displayIdentity(){const email=(session?.user?.email||'').toLowerCase();if(profile?.name){const r=profile?.role==='parlamentario'?'Parlamentario':profile?.role==='admin'?'Administración':profile?.role==='asesor'?'Asesor':(profile?.role||'Usuario');return {name:profile.name,role:r}}if(email==='lopez.s@legebiltzarra.eus')return {name:'Santi López',role:'Parlamentario'};if(email==='glangarica.a@legebiltzarra.eus')return {name:'Alba Langarica',role:'Administración'};return {name:'Usuario',role:'Usuario'}}
function render(){if(!session)return renderLogin();const ident=displayIdentity(),name=ident.name,role=ident.role;app.innerHTML=`<header><div class="headerline"><div class="brandline">${isAdmin()?'':`<img class="gpv-header-logo" src="gpv-header-logo.png?v=6" alt="PP Vasco · Grupo Popular Vasco">`}</div><button class="logout" id="logout">Salir</button></div><h1>${esc(name)}</h1><span>${esc(role)}</span></header><main>${tab==='Inicio'?inicio():tab==='Radar'?radar():tab==='Panel'?panelGeneral():tab==='Tareas'?tareas():tab==='Iniciativas'?iniciativas():`<div class="soon"><h2>${tab}</h2><p>Módulo preparado para la siguiente fase.</p></div>`}</main><nav class="bottomnav">${[['Inicio','⌂'],['Radar','◎'],['Panel','◉'],['Iniciativas','▤'],['Tareas','☑']].map(([n,i])=>`<button data-tab="${n}" class="${tab===n?'active':''}"><span>${i}</span><small>${n==='Panel'?'Panel general':n}</small></button>`).join('')}</nav><div id="modal"></div>`;bind()}
function bind(){
document.getElementById('logout').onclick=()=>{storeSession(null);profile=null;agendaItems=[];renderLogin()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});
document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.toggle);const before=tasks.find(t=>t.id===id);tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save();render();showToast(before?.done?'Tarea reabierta':'Tarea completada')});
document.querySelectorAll('[data-task-longpress]').forEach(el=>{let timer=null,longFired=false;const clear=()=>{if(timer){clearTimeout(timer);timer=null}el.classList.remove('pressing')};el.addEventListener('pointerdown',e=>{if(e.target.closest('.check'))return;longFired=false;el.classList.add('pressing');timer=setTimeout(()=>{timer=null;longFired=true;el.classList.remove('pressing');if(navigator.vibrate)navigator.vibrate(20);openTaskModal(Number(el.dataset.taskLongpress))},600)});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,clear));el.addEventListener('click',e=>{if(longFired){e.preventDefault();e.stopPropagation();longFired=false}})});
document.querySelectorAll('[data-agenda-filter]').forEach(b=>b.onclick=()=>{const f=b.dataset.agendaFilter;if(agendaFilters.has(f))agendaFilters.delete(f);else agendaFilters.add(f);render()});
document.querySelectorAll('[data-initiative-filter]').forEach(b=>b.onclick=()=>{initiativeFilter=b.dataset.initiativeFilter;render()});
document.querySelectorAll('[data-admin-person]').forEach(s=>s.onchange=()=>{adminParlamentarioFilter=s.value;render()});
document.querySelectorAll('[data-radar-person]').forEach(s=>s.onchange=()=>{radarParlamentarioFilter=s.value;render()});
document.querySelectorAll('[data-home-initiative-filter]').forEach(b=>b.onclick=()=>{homeInitiativeFilter=b.dataset.homeInitiativeFilter;render()});
document.querySelectorAll('[data-task-filter]').forEach(b=>b.onclick=()=>{homeTaskFilter=b.dataset.taskFilter;render()});
const q=document.getElementById('quickAdd');if(q)q.onclick=()=>{const text=document.getElementById('quickTaskText').value.trim();if(!text)return;tasks.push({id:Date.now(),title:text,area:document.getElementById('quickArea').value,when:'Sin fecha',priority:document.getElementById('quickPriority').value,done:false});save();render();showToast('Tarea añadida a Tareas')};
document.querySelectorAll('[data-radar-dismiss]').forEach(b=>b.onclick=()=>{const id=b.dataset.radarDismiss;localStorage.setItem('gpvRadarDismissed:'+id,'1');render();showToast('Noticia descartada',()=>{localStorage.removeItem('gpvRadarDismissed:'+id);render();showToast('Noticia restaurada')})});
document.querySelectorAll('[data-radar-task]').forEach(b=>b.onclick=()=>{const x=radarItems.find(r=>r.id===b.dataset.radarTask);if(!x)return;const added={id:Date.now(),title:x.titulo,area:x.area||'Otros',when:'Sin fecha',priority:'Pronto',done:false};tasks.push(added);save();render();showToast('Tarea añadida a Tareas',()=>{tasks=tasks.filter(t=>t.id!==added.id);save();render();showToast('Tarea eliminada')})});
const n=document.getElementById('newTask');if(n)n.onclick=()=>openTaskModal();
}
function openTaskModal(id=null){
 const editing=id!==null,t=editing?tasks.find(x=>x.id===id):null;
 if(editing&&!t)return;
 document.getElementById('modal').innerHTML=`<div class="modal"><div class="sheet"><h2>${editing?'Editar tarea':'Nueva tarea'}</h2><label>Tarea</label><input id="taskText" placeholder="¿Qué hay que hacer?" maxlength="160" value="${esc(t?.title||'')}"><label>Prioridad</label><select id="taskPriority">${['Urgente','Pronto','Cuando pueda'].map(v=>`<option ${t?.priority===v?'selected':''}>${v}</option>`).join('')}</select><label>Área</label><select id="taskArea">${['Justicia','Cultura','Movilidad sostenible','Otros'].map(v=>`<option ${t?.area===v?'selected':''}>${v}</option>`).join('')}</select><label>Cuándo / plazo</label><input id="taskWhen" placeholder="Sin fecha" value="${esc(t?.when||'Sin fecha')}"><div class="actions"><button class="primary" id="saveTask">${editing?'Guardar cambios':'Añadir tarea'}</button><button id="cancelTask">Cancelar</button>${editing?'<button class="danger" id="deleteFromModal">Eliminar</button>':''}</div></div></div>`;
 document.getElementById('cancelTask').onclick=()=>document.getElementById('modal').innerHTML='';
 document.getElementById('saveTask').onclick=()=>{const title=document.getElementById('taskText').value.trim();if(!title)return;const data={title,priority:document.getElementById('taskPriority').value,area:document.getElementById('taskArea').value,when:document.getElementById('taskWhen').value.trim()||'Sin fecha'};if(editing)tasks=tasks.map(x=>x.id===id?{...x,...data}:x);else tasks.push({id:Date.now(),...data,done:false});save();render();showToast(editing?'Cambios guardados':'Tarea añadida a Tareas')};
 const del=document.getElementById('deleteFromModal');if(del)del.onclick=()=>{const idx=tasks.findIndex(x=>x.id===id),removed=tasks[idx];if(idx<0)return;tasks.splice(idx,1);save();render();showToast('Tarea eliminada',()=>{tasks.splice(Math.min(idx,tasks.length),0,removed);save();render();showToast('Tarea restaurada')})};
}
if(loadStoredSession()){app.innerHTML='<div class="loading">Conectando con la agenda…</div>';loadData()}else renderLogin();
})();
</script></body></html>
