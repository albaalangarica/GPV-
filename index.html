<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24458a"><title>GPV · Santi López</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17233b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:82px}header{background:#24458a;color:#fff;padding:22px 24px 26px}.eyebrow{display:flex;gap:12px;align-items:center;font-size:15px}.eyebrow b{background:#ffffff20;padding:7px 9px;border-radius:4px}h1{font-size:36px;margin:18px 0 2px}header span{color:#dce5f5}main{padding:14px}.card,.alert{background:#fff;border:1px solid #dbe2ec;border-radius:10px;margin-bottom:14px;overflow:hidden}.alert{padding:17px 20px;background:#fff5f2;border-color:#efcfc5}.alert h3,.cardtitle h3,.group-title{font-size:15px;letter-spacing:.08em;color:#193b7a}.alert h3{color:#a84432;margin:0 0 10px}.alert p{margin:8px 0;line-height:1.38}.cardtitle{padding:14px 18px;background:#f0f3f8;border-bottom:1px solid #dbe2ec;display:flex;justify-content:space-between;align-items:center}.cardtitle h3{margin:0}.cardtitle span{color:#8995a7;font-size:13px}.row{display:grid;grid-template-columns:90px 1fr;padding:14px 18px;border-bottom:1px solid #e7ebf1}.date{font-weight:700;line-height:1.45;white-space:pre-line}.row b,.task b{display:block}.row small,.task small{display:block;color:#8b97a9;margin-top:4px}.pills{display:flex;gap:7px;padding:11px 16px;flex-wrap:wrap}.pill{padding:7px 11px;border:1px solid #d8dfeb;border-radius:999px;font-size:12px;background:#fff}.pill.active{background:#24458a;color:#fff}.task{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:9px;align-items:center;padding:13px 16px;border-top:1px solid #edf0f4}.check{width:23px;height:23px;border:2px solid #aab6c6;border-radius:50%;background:#fff}.check.done{background:#24458a;border-color:#24458a;position:relative}.check.done:after{content:'✓';color:#fff;position:absolute;left:4px;top:-1px;font-weight:800}.task.done b{text-decoration:line-through;color:#8b97a9}.badge{font-size:10px;font-weight:800;background:#fff0e9;padding:5px 7px;border-radius:6px;color:#a84432}.group-title{margin:18px 4px 8px}.taskbox{background:#fff;border:1px solid #dbe2ec;border-radius:10px;overflow:hidden;margin-bottom:14px}.taskhead{display:flex;justify-content:space-between;align-items:center;margin:3px 2px 12px}.taskhead h2{margin:0}.taskhead button,.primary{border:0;background:#24458a;color:#fff;border-radius:10px;padding:11px 14px;font-weight:700}.soon{padding:40px 5px;color:#67758b}.linkbtn{border:0;background:none;color:#193b7a;font-weight:700;padding:12px 18px;font-size:14px}.bottomnav{position:fixed;bottom:0;left:0;right:0;margin:auto;max-width:760px;height:72px;padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid #dce2ea;display:grid;grid-template-columns:repeat(5,1fr);z-index:5}.bottomnav button{border:0;background:#fff;color:#9aa6b5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:19px}.bottomnav button.active{color:#24458a;border-top:3px solid #f2b33d}.bottomnav small{font-size:10px}.modal{position:fixed;inset:0;background:#0007;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:min(760px,100%);padding:22px;border-radius:18px 18px 0 0}.sheet h2{margin-top:0}.sheet input,.sheet select{width:100%;padding:14px;font-size:16px;border:1px solid #ccd5e1;border-radius:9px;margin:7px 0}.actions{display:flex;gap:8px;margin-top:10px}.actions button{padding:12px 15px;border-radius:9px;border:1px solid #ccd5e1}.actions .primary{border:0}.hidden{display:none}@media(max-width:420px){h1{font-size:31px}.row{grid-template-columns:78px 1fr}.badge{display:none}main{padding:11px}header{padding:19px}}
</style>
</head><body><div id="app" class="app"></div>
<script>
(function(){
const seed=[{id:1,title:'Revisar enmiendas a la ley de transparencia',area:'Justicia',when:'Hoy',priority:'Urgente',done:false},{id:2,title:'Preparar intervención para comisión de Justicia',area:'Justicia',when:'Mañana',priority:'Urgente',done:false},{id:3,title:'Recopilar datos sobre inversión en cultura',area:'Cultura',when:'En 3 días',priority:'Pronto',done:false}];
let tasks;try{tasks=JSON.parse(localStorage.getItem('gpv_tasks_v1'))||seed}catch(e){tasks=seed}let tab='Inicio';const app=document.getElementById('app');
function save(){localStorage.setItem('gpv_tasks_v1',JSON.stringify(tasks))}
function card(title,extra,body){return `<section class="card"><div class="cardtitle"><h3>${title}</h3><span>${extra||''}</span></div>${body}</section>`}
function taskHTML(t){return `<div class="task ${t.done?'done':''}"><button class="check ${t.done?'done':''}" data-toggle="${t.id}" aria-label="Completar tarea"></button><div><b>${esc(t.title)}</b><small>${esc(t.area)} · ${esc(t.when)}</small></div><span class="badge">${esc(t.priority)}</span></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function agenda(){return card('AGENDA','Próximas citas',`<div class="pills"><span class="pill active">Grupo</span><span class="pill">Plenos</span><span class="pill">Visitas</span></div><div class="row"><div class="date">9 sep\n12:00</div><div><b>Reunión de grupo</b><small>Parlamento Vasco</small></div></div><div class="row"><div class="date">17 sep\n09:30</div><div><b>Pleno · Debate de política general</b><small>Salón de sesiones</small></div></div><div class="row"><div class="date">24 sep\n09:30</div><div><b>Pleno ordinario</b><small>Salón de sesiones</small></div></div>`)}
function inicio(){const open=tasks.filter(t=>!t.done);return `<section class="alert"><h3>VENCIMIENTOS</h3><p><b>Fortalecer la pelota vasca</b> — enmiendas hasta el 9 de septiembre de 2026</p><p><b>Lanzadera L3–Aeropuerto de Loiu</b> — enmiendas hasta el 9 de septiembre de 2026</p><p><b>Denominación «Aeropuerto Lehendakari Aguirre»</b> — enmiendas hasta el 9 de septiembre de 2026</p></section>${agenda()}${card('TAREAS','Ver todas →',`<div class="pills"><span class="pill active">Urgentes ${open.filter(x=>x.priority==='Urgente').length}</span><span class="pill">Pronto ${open.filter(x=>x.priority==='Pronto').length}</span><span class="pill">Cuando pueda ${open.filter(x=>x.priority==='Cuando pueda').length}</span></div>${open.slice(0,3).map(taskHTML).join('')}<button class="linkbtn" data-go="Tareas">→ Ver todas las tareas</button>`)}`}
function tareas(){let out=`<div class="taskhead"><h2>Tareas</h2><button id="newTask">＋ Nueva</button></div>`;['Urgente','Pronto','Cuando pueda'].forEach(p=>{const a=tasks.filter(x=>x.priority===p&&!x.done);if(a.length)out+=`<h3 class="group-title">${p.toUpperCase()} · ${a.length}</h3><div class="taskbox">${a.map(taskHTML).join('')}</div>`});const done=tasks.filter(x=>x.done);if(done.length)out+=`<h3 class="group-title">COMPLETADAS · ${done.length}</h3><div class="taskbox">${done.map(taskHTML).join('')}</div>`;return out}
function render(){app.innerHTML=`<header><div class="eyebrow"><b>GPV</b> Dashboard parlamentario</div><h1>Santi López</h1><span>Parlamentario</span></header><main>${tab==='Inicio'?inicio():tab==='Tareas'?tareas():`<div class="soon"><h2>${tab}</h2><p>Módulo preparado para la siguiente fase.</p></div>`}</main><nav class="bottomnav">${[['Inicio','⌂'],['Radar','◎'],['Iniciativas','▤'],['Tareas','☑'],['Agenda','▣']].map(([n,i])=>`<button data-tab="${n}" class="${tab===n?'active':''}"><span>${i}</span><small>${n}</small></button>`).join('')}</nav><div id="modal"></div>`;bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.toggle);tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save();render()});const n=document.getElementById('newTask');if(n)n.onclick=openModal}
function openModal(){document.getElementById('modal').innerHTML=`<div class="modal"><div class="sheet"><h2>Nueva tarea</h2><input id="taskText" placeholder="¿Qué hay que hacer?" maxlength="160"><select id="taskPriority"><option>Pronto</option><option>Urgente</option><option>Cuando pueda</option></select><select id="taskArea"><option>Justicia</option><option>Cultura</option><option>Movilidad sostenible</option><option>Otros</option></select><div class="actions"><button class="primary" id="addTask">Añadir tarea</button><button id="cancelTask">Cancelar</button></div></div></div>`;document.getElementById('cancelTask').onclick=()=>document.getElementById('modal').innerHTML='';document.getElementById('addTask').onclick=()=>{const text=document.getElementById('taskText').value.trim();if(!text)return;tasks.push({id:Date.now(),title:text,area:document.getElementById('taskArea').value,when:'Sin fecha',priority:document.getElementById('taskPriority').value,done:false});save();render()}}
render();
})();
</script></body></html>
