<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24458a"><title>GPV · Santi López</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17233b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:82px}header{background:#24458a;color:#fff;padding:22px 24px 26px}.eyebrow{display:flex;gap:12px;align-items:center;font-size:15px}.eyebrow b{background:#ffffff20;padding:7px 9px;border-radius:4px}h1{font-size:36px;margin:18px 0 2px}header span{color:#dce5f5}main{padding:14px}.card,.alert{background:#fff;border:1px solid #dbe2ec;border-radius:10px;margin-bottom:14px;overflow:hidden}.alert{padding:17px 20px;background:#fff5f2;border-color:#efcfc5}.alert h3,.cardtitle h3,.group-title{font-size:15px;letter-spacing:.08em;color:#193b7a}.alert h3{color:#a84432;margin:0 0 10px}.alert p{margin:8px 0;line-height:1.38}.cardtitle{padding:14px 18px;background:#f0f3f8;border-bottom:1px solid #dbe2ec;display:flex;justify-content:space-between;align-items:center}.cardtitle h3{margin:0}.cardtitle span{color:#8995a7;font-size:13px}.row{display:grid;grid-template-columns:90px 1fr;padding:14px 18px;border-bottom:1px solid #e7ebf1}.date{font-weight:700;line-height:1.45;white-space:pre-line}.row b,.task b{display:block}.row small,.task small{display:block;color:#8b97a9;margin-top:4px}.pills{display:flex;gap:7px;padding:11px 16px;flex-wrap:wrap}.pill{padding:7px 11px;border:1px solid #d8dfeb;border-radius:999px;font-size:12px;background:#fff;color:#17233b;font-family:inherit;cursor:pointer}.pill:focus-visible{outline:2px solid #24458a;outline-offset:2px}.pill.active{background:#24458a;color:#fff}.task{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:9px;align-items:center;padding:13px 16px;border-top:1px solid #edf0f4}.check{width:23px;height:23px;border:2px solid #aab6c6;border-radius:50%;background:#fff}.check.done{background:#24458a;border-color:#24458a;position:relative}.check.done:after{content:'✓';color:#fff;position:absolute;left:4px;top:-1px;font-weight:800}.task.done b{text-decoration:line-through;color:#8b97a9}.badge{font-size:10px;font-weight:800;background:#fff0e9;padding:5px 7px;border-radius:6px;color:#a84432}.group-title{margin:18px 4px 8px}.taskbox{background:#fff;border:1px solid #dbe2ec;border-radius:10px;overflow:hidden;margin-bottom:14px}.taskhead{display:flex;justify-content:space-between;align-items:center;margin:3px 2px 12px}.taskhead h2{margin:0}.taskhead button,.primary{border:0;background:#24458a;color:#fff;border-radius:10px;padding:11px 14px;font-weight:700}.soon{padding:40px 5px;color:#67758b}.linkbtn{border:0;background:none;color:#193b7a;font-weight:700;padding:12px 18px;font-size:14px}.bottomnav{position:fixed;bottom:0;left:0;right:0;margin:auto;max-width:760px;height:72px;padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid #dce2ea;display:grid;grid-template-columns:repeat(5,1fr);z-index:5}.bottomnav button{border:0;background:#fff;color:#9aa6b5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:19px}.bottomnav button.active{color:#24458a;border-top:3px solid #f2b33d}.bottomnav small{font-size:10px}.modal{position:fixed;inset:0;background:#0007;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:min(760px,100%);padding:22px;border-radius:18px 18px 0 0}.sheet h2{margin-top:0}.sheet input,.sheet select{width:100%;padding:14px;font-size:16px;border:1px solid #ccd5e1;border-radius:9px;margin:7px 0}.actions{display:flex;gap:8px;margin-top:10px}.actions button{padding:12px 15px;border-radius:9px;border:1px solid #ccd5e1}.actions .primary{border:0}.hidden{display:none}@media(max-width:420px){h1{font-size:31px}.row{grid-template-columns:78px 1fr}.badge{display:none}main{padding:11px}header{padding:19px}}

.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f5f7fa}.loginbox{width:min(430px,100%);background:#fff;border:1px solid #dbe2ec;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px #193b7a12}.loginhead{background:#24458a;color:#fff;padding:24px}.loginhead b{display:inline-block;background:#ffffff20;padding:7px 9px;border-radius:4px;margin-bottom:14px}.loginhead h1{font-size:28px;margin:0 0 4px}.loginbody{padding:22px}.loginbody label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px;color:#33415c}.loginbody input{width:100%;padding:14px;font-size:16px;border:1px solid #cbd5e1;border-radius:9px}.loginbody button{width:100%;margin-top:18px;border:0;background:#24458a;color:#fff;border-radius:9px;padding:14px;font-size:16px;font-weight:700}.error{margin-top:12px;color:#a84432;font-size:13px}.loading{padding:30px;text-align:center;color:#67758b}.logout{border:1px solid #ffffff66;background:transparent;color:#fff;border-radius:8px;padding:7px 10px;font-size:12px}.headerline{display:flex;justify-content:space-between;align-items:center}.meta{font-size:12px;color:#8b97a9;margin-top:4px}.empty{padding:18px;color:#8b97a9}.syncnote{padding:9px 16px;font-size:11px;color:#7b8798;border-top:1px solid #edf0f4;background:#fafbfd}.</style>
</head><body><div id="app" class="app"></div>
<script>
(function(){
const SUPABASE_URL='https://baouzhstdacwrijufkgf.supabase.co';
const SUPABASE_KEY='sb_publishable_0IxQU9UXOH5GStO4Hp-z-A_ndghtF9w';
const seed=[{id:1,title:'Revisar enmiendas a la ley de transparencia',area:'Justicia',when:'Hoy',priority:'Urgente',done:false},{id:2,title:'Preparar intervención para comisión de Justicia',area:'Justicia',when:'Mañana',priority:'Urgente',done:false},{id:3,title:'Recopilar datos sobre inversión en cultura',area:'Cultura',when:'En 3 días',priority:'Pronto',done:false}];
let tasks;try{tasks=JSON.parse(localStorage.getItem('gpv_tasks_v1'))||seed}catch(e){tasks=seed}
let session=null,profile=null,agendaItems=[],tab='Inicio',agendaFilters=new Set(['Grupo','Plenos y comisiones','Visitas']),homeTaskFilter='Urgente';
const app=document.getElementById('app');
function save(){localStorage.setItem('gpv_tasks_v1',JSON.stringify(tasks))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function apiHeaders(auth=true){const h={'apikey':SUPABASE_KEY,'Content-Type':'application/json'};if(auth&&session?.access_token)h['Authorization']='Bearer '+session.access_token;return h}
function storeSession(s){session=s;if(s)localStorage.setItem('gpv_supabase_session',JSON.stringify(s));else localStorage.removeItem('gpv_supabase_session')}
function loadStoredSession(){try{const s=JSON.parse(localStorage.getItem('gpv_supabase_session'));if(s?.access_token){session=s;return true}}catch(e){}return false}
async function login(email,password){const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:apiHeaders(false),body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'No se ha podido iniciar sesión');storeSession(d);await loadData()}
async function loadData(){try{const [pr,ag]=await Promise.all([fetch(SUPABASE_URL+'/rest/v1/profiles?select=name,email,role',{headers:apiHeaders()}),fetch(SUPABASE_URL+'/rest/v1/agenda_events?select=*&order=event_date.asc,event_time.asc',{headers:apiHeaders()})]);if(pr.status===401||ag.status===401){storeSession(null);return renderLogin('La sesión ha caducado. Vuelve a entrar.')}if(pr.ok){const a=await pr.json();profile=a[0]||null}if(ag.ok)agendaItems=await ag.json();render()}catch(e){renderLogin('No se ha podido conectar con la base de datos.')} }
function renderLogin(msg=''){app.innerHTML=`<div class="loginwrap"><div class="loginbox"><div class="loginhead"><b>GPV</b><h1>Dashboard parlamentario</h1><div>Acceso privado</div></div><div class="loginbody"><form id="loginForm"><label>Correo</label><input id="email" type="email" autocomplete="username" value="lopez.s@legebiltzarra.eus" required><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Entrar</button><div id="loginError" class="error">${esc(msg)}</div></form></div></div></div>`;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;b.textContent='Entrando…';try{await login(document.getElementById('email').value.trim(),document.getElementById('password').value)}catch(err){document.getElementById('loginError').textContent=err.message;b.disabled=false;b.textContent='Entrar'}}}
function card(title,extra,body){return `<section class="card"><div class="cardtitle"><h3>${title}</h3><span>${extra||''}</span></div>${body}</section>`}
function taskHTML(t){return `<div class="task ${t.done?'done':''}"><button class="check ${t.done?'done':''}" data-toggle="${t.id}" aria-label="Completar tarea"></button><div><b>${esc(t.title)}</b><small>${esc(t.area)} · ${esc(t.when)}</small></div><span class="badge">${esc(t.priority)}</span></div>`}
function category(x){const t=(x.type||'').toLowerCase(),o=(x.organ_activity||'').toLowerCase();if(t.includes('visita'))return 'Visitas';if(t.includes('pleno')||t.includes('comisión'))return 'Plenos y comisiones';if(t.includes('reunión')||o.includes('grupo popular')||o.includes('grupo parlamentario'))return 'Grupo';return 'Otros'}
function fmtDate(iso){if(!iso)return'';const [y,m,d]=iso.split('-');return `${Number(d)} ${['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][Number(m)-1]}`}
function agendaRows(full=false){let items=agendaItems.filter(x=>category(x)!=='Otros'&&agendaFilters.has(category(x)));if(!full)items=items.filter(x=>x.event_date>='2026-09-05').slice(0,6);return items.length?items.map(x=>`<div class="row"><div class="date">${fmtDate(x.event_date)}\n${esc(x.event_time||'')}</div><div><b>${esc(x.detail||x.organ_activity)}</b><small>${esc(x.organ_activity)}${x.location?' · '+esc(x.location):''}</small></div></div>`).join(''):`<div class="empty">Sin citas en las categorías seleccionadas.</div>`}
function agenda(full=false){const pills=['Grupo','Plenos y comisiones','Visitas'].map(x=>`<button type="button" class="pill ${agendaFilters.has(x)?'active':''}" data-agenda-filter="${x}" aria-pressed="${agendaFilters.has(x)}">${x}</button>`).join('');return card('AGENDA',full?'Agenda parlamentaria':'Próximas citas',`<div class="pills">${pills}</div>${agendaRows(full)}<div class="syncnote">Datos procedentes de la pestaña Agenda del seguimiento parlamentario.</div>`)}
function vencimientos(){const v=agendaItems.filter(x=>(x.type||'').toLowerCase()==='vencimiento'&&x.event_date>='2026-09-05').slice(0,6);if(!v.length)return'';return `<section class="alert"><h3>VENCIMIENTOS</h3>${v.map(x=>`<p><b>${esc((x.detail||'').replace(/^[^:]+:\s*/,''))}</b> — ${fmtDate(x.event_date)}${x.detail&&x.detail.includes(':')?' · '+esc(x.detail.split(':')[0]):''}</p>`).join('')}</section>`}
function inicio(){const open=tasks.filter(t=>!t.done),priorities=['Urgente','Pronto','Cuando pueda'];const pills=priorities.map(p=>`<button type="button" class="pill ${homeTaskFilter===p?'active':''}" data-task-filter="${p}">${p==='Urgente'?'Urgentes':p} ${open.filter(x=>x.priority===p).length}</button>`).join('');const selected=open.filter(x=>x.priority===homeTaskFilter);const taskRows=selected.length?selected.slice(0,3).map(taskHTML).join(''):`<div class="task"><div></div><div><small>No hay tareas ${homeTaskFilter.toLowerCase()} pendientes.</small></div><div></div></div>`;return `${vencimientos()}${agenda(false)}${card('TAREAS','Ver todas →',`<div class="pills">${pills}</div>${taskRows}<button class="linkbtn" data-go="Tareas">→ Ver todas las tareas</button>`)}`}
function tareas(){let out=`<div class="taskhead"><h2>Tareas</h2><button id="newTask">＋ Nueva</button></div>`;['Urgente','Pronto','Cuando pueda'].forEach(p=>{const a=tasks.filter(x=>x.priority===p&&!x.done);if(a.length)out+=`<h3 class="group-title">${p.toUpperCase()} · ${a.length}</h3><div class="taskbox">${a.map(taskHTML).join('')}</div>`});const done=tasks.filter(x=>x.done);if(done.length)out+=`<h3 class="group-title">COMPLETADAS · ${done.length}</h3><div class="taskbox">${done.map(taskHTML).join('')}</div>`;return out}
function render(){if(!session)return renderLogin();const name=profile?.name||'Santi López',role=profile?.role==='parlamentario'?'Parlamentario':(profile?.role||'Usuario');app.innerHTML=`<header><div class="headerline"><div class="eyebrow"><b>GPV</b> Dashboard parlamentario</div><button class="logout" id="logout">Salir</button></div><h1>${esc(name)}</h1><span>${esc(role)}</span></header><main>${tab==='Inicio'?inicio():tab==='Tareas'?tareas():tab==='Agenda'?agenda(true):`<div class="soon"><h2>${tab}</h2><p>Módulo preparado para la siguiente fase.</p></div>`}</main><nav class="bottomnav">${[['Inicio','⌂'],['Radar','◎'],['Iniciativas','▤'],['Tareas','☑'],['Agenda','▣']].map(([n,i])=>`<button data-tab="${n}" class="${tab===n?'active':''}"><span>${i}</span><small>${n}</small></button>`).join('')}</nav><div id="modal"></div>`;bind()}
function bind(){document.getElementById('logout').onclick=()=>{storeSession(null);profile=null;agendaItems=[];renderLogin()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.toggle);tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save();render()});document.querySelectorAll('[data-agenda-filter]').forEach(b=>b.onclick=()=>{const f=b.dataset.agendaFilter;if(agendaFilters.has(f))agendaFilters.delete(f);else agendaFilters.add(f);render()});document.querySelectorAll('[data-task-filter]').forEach(b=>b.onclick=()=>{homeTaskFilter=b.dataset.taskFilter;render()});const n=document.getElementById('newTask');if(n)n.onclick=openModal}
function openModal(){document.getElementById('modal').innerHTML=`<div class="modal"><div class="sheet"><h2>Nueva tarea</h2><input id="taskText" placeholder="¿Qué hay que hacer?" maxlength="160"><select id="taskPriority"><option>Pronto</option><option>Urgente</option><option>Cuando pueda</option></select><select id="taskArea"><option>Justicia</option><option>Cultura</option><option>Movilidad sostenible</option><option>Otros</option></select><div class="actions"><button class="primary" id="addTask">Añadir tarea</button><button id="cancelTask">Cancelar</button></div></div></div>`;document.getElementById('cancelTask').onclick=()=>document.getElementById('modal').innerHTML='';document.getElementById('addTask').onclick=()=>{const text=document.getElementById('taskText').value.trim();if(!text)return;tasks.push({id:Date.now(),title:text,area:document.getElementById('taskArea').value,when:'Sin fecha',priority:document.getElementById('taskPriority').value,done:false});save();render()}}
if(loadStoredSession()){app.innerHTML='<div class="loading">Conectando con la agenda…</div>';loadData()}else renderLogin();
})();
</script></body></html>
