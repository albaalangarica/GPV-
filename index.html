<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071330"><meta name="apple-mobile-web-app-title" content="GPV"><meta name="application-name" content="GPV"><link rel="manifest" href="manifest.webmanifest?v=3"><link rel="icon" type="image/png" sizes="48x48" href="favicon.png?v=2"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>GPV</title><link rel="apple-touch-icon" href="gpv-icon.png?v=9"><link rel="apple-touch-icon" sizes="180x180" href="gpv-icon.png?v=9"><link rel="icon" type="image/png" sizes="180x180" href="gpv-icon.png?v=9">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ==== GPV · sistema visual (inspirado en NNGG Euskadi) ====
 * Zonas de identidad en azul noche + blanco + azul eléctrico;
 * zonas de información en gris azulado claro con tarjetas blancas. */
:root{
 --night:#071330;--night-2:#0e2049;--night-3:#1a2f63;--brand:#1e4b8f;
 --electric:#1e5bff;--electric-600:#1447d6;--electric-50:#ebf1ff;--sky:#7fb2ff;
 --mist:#eef2f8;--line:#dbe3ef;--line-strong:#c3cfe1;--slate:#586a8a;--ink:#0b1a3a;
 --success:#0f7a55;--success-50:#e7f6ef;--warning:#a35a00;--warning-50:#fff4e2;--danger:#c22a3a;--danger-50:#fdecee;
 --radius-card:22px;--radius-btn:14px;--ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;text-size-adjust:100%}
body{margin:0;background:var(--mist);color:var(--ink);font-family:'Montserrat',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--electric)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--electric);outline-offset:2px;border-radius:8px}
.app{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.ico{flex:0 0 auto;display:inline-block;vertical-align:middle}
.press{transition:transform .14s var(--ease),background-color .16s,border-color .16s,color .16s}
.press:active{transform:scale(.97)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.display{font-weight:800;letter-spacing:-.035em;line-height:.98}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:1ms!important;transition-duration:1ms!important}}

/* Cabecera */
.ni-top{position:sticky;top:0;z-index:40;background:var(--night);color:#fff;padding-top:env(safe-area-inset-top)}
.ni-top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.ni-logo{display:block;height:27px;width:auto}
.ni-word{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.ni-word b{font-size:20px;font-weight:900;letter-spacing:-.04em}
.ni-word span{white-space:nowrap;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.ni-beta{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);background:rgba(127,178,255,.15);border-radius:999px;padding:3px 8px}
.ni-user{position:relative;margin-left:auto}
.ni-user>summary{list-style:none}
.ni-user>summary::-webkit-details-marker{display:none}
.ni-usermenu{position:absolute;right:0;top:46px;z-index:60;min-width:230px;background:#fff;color:var(--night);border-radius:16px;box-shadow:0 18px 40px -12px rgba(7,19,48,.45);padding:14px;display:flex;flex-direction:column;gap:4px}
.ni-usermenu b{font-size:15px}
.ni-usermenu small{color:var(--slate);font-size:12px;margin-bottom:6px}
.ni-usermenu button,.ni-usermenu a{display:flex;align-items:center;gap:10px;border:0;background:var(--mist);color:var(--night);border-radius:12px;padding:11px 12px;font:inherit;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;text-align:left}
.ni-usermenu button{background:#fdecec;color:var(--danger)}
.ni-avatar{margin-left:auto;display:flex;align-items:center;gap:8px;border:0;background:none;color:#fff;cursor:pointer;padding:0}
.ni-avatar small{white-space:nowrap;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.ni-avatar i{font-style:normal;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--electric);font-size:12px;font-weight:800}

/* Barra inferior */
.ni-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(7,19,48,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.1);padding-bottom:env(safe-area-inset-bottom)}
.ni-nav ul{list-style:none;margin:0 auto;padding:0 4px;max-width:480px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.ni-nav button{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;border:0;background:none;cursor:pointer;color:rgba(255,255,255,.55)}
.ni-nav .ni-navpill{display:flex;align-items:center;justify-content:center;width:56px;height:32px;border-radius:999px;transition:background-color .2s}
.ni-nav small{font-size:10px;font-weight:600;letter-spacing:.02em}
.ni-nav .active{color:#fff}
.ni-nav .active .ni-navpill{background:var(--electric)}
.ni-nav .active small{font-weight:800}
.ni-nav .dot{position:absolute;margin:-14px 0 0 22px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#ff5a6e;color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* Bandas de identidad */
.ni-hero{position:relative;overflow:hidden;background:var(--night);color:#fff}
.ni-hero:before{content:'';position:absolute;right:-110px;top:-110px;width:320px;height:320px;border-radius:50%;background:rgba(30,91,255,.28);filter:blur(60px);pointer-events:none}
.ni-hero .wrap{position:relative;padding-top:26px;padding-bottom:34px}
.ni-hero .eyebrow{color:var(--sky)}
.ni-hero h1{margin:14px 0 0;font-size:40px}
.ni-hero p.sub{margin:12px 0 0;max-width:560px;color:rgba(255,255,255,.72);font-size:15px}
.ni-next{display:flex;align-items:center;gap:14px;margin-top:24px;max-width:520px;padding:14px;border-radius:18px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;text-align:left;width:100%;cursor:pointer}
.ni-next:hover{background:rgba(255,255,255,.1)}
.ni-next .tile{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;background:var(--electric);flex:0 0 auto}
.ni-next .txt{min-width:0;flex:1}
.ni-next .txt small{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}
.ni-next .txt b{display:block;margin-top:3px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni-next .txt span{display:block;margin-top:2px;font-size:12px;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni-shortcuts{display:flex;gap:8px;overflow-x:auto;margin:26px -16px 0;padding:0 16px;scrollbar-width:none}
.ni-shortcuts::-webkit-scrollbar{display:none}
.ni-shortcuts button,.ni-shortcuts a{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:none;color:rgba(255,255,255,.88);font-size:13px;font-weight:600;text-decoration:none;cursor:pointer}
.ni-shortcuts .count{background:var(--electric);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:800}
.ni-head{background:var(--night);color:#fff}
.ni-head .wrap{padding-top:22px;padding-bottom:28px}
.ni-head .eyebrow{color:var(--sky)}
.ni-back{display:inline-flex;align-items:center;gap:4px;margin:0 0 14px -4px;border:0;background:none;padding:4px;color:rgba(255,255,255,.7);font:inherit;font-size:13px;font-weight:600;cursor:pointer}.ni-back:hover{color:#fff}
.ni-head h1{margin:10px 0 0;font-size:36px}
.ni-head p{margin:10px 0 0;max-width:600px;color:rgba(255,255,255,.7);font-size:14px}

/* Secciones */
.ni-section{padding:28px 0 6px}
.ni-section.dark{background:var(--night);color:#fff;padding:32px 0 30px;margin-top:22px}
.ni-sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.ni-sechead .eyebrow{color:var(--electric)}
.ni-section.dark .ni-sechead .eyebrow{color:var(--sky)}
.ni-sechead h2{margin:6px 0 0;font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.05}
.ni-link{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;color:var(--electric);font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.ni-section.dark .ni-link{color:var(--sky)}
.ni-grid{display:grid;gap:12px}
@media (min-width:760px){.ni-grid.two{grid-template-columns:1fr 1fr}.ni-hero h1{font-size:56px}.ni-head h1{font-size:46px}}

/* Tarjetas */
.ni-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-card);padding:18px;animation:rise .42s var(--ease) both}
.ni-event{display:flex;gap:14px}
.ni-event.past{opacity:.7}
.ni-event-body{min-width:0;flex:1}
.ni-event h3,.ni-init h3{margin:8px 0 0;font-size:16px;font-weight:700;line-height:1.3;letter-spacing:-.01em;color:var(--night)}
.ni-event-detail{margin:5px 0 0;color:var(--slate);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ni-evtop{display:flex;align-items:center;gap:8px;min-width:0}
.ni-evinfo{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--slate);font-size:12.5px;font-weight:600}
.ni-evtop .cal-btn{margin-left:auto;flex:0 0 auto;display:inline-flex!important;padding:0!important;font-size:17px!important;line-height:1;background:none;border:0;cursor:pointer}
.ni-event.pleno .ni-evinfo{color:rgba(255,255,255,.75)}
.ni-event{padding:14px 16px}
.ni-event h3{margin-top:6px!important}
.ni-event .ni-date{width:50px;padding:6px 0 7px}
.ni-meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;color:var(--slate);font-size:12.5px;font-weight:500}
.ni-meta span{display:inline-flex;align-items:center;gap:5px;min-width:0}
.ni-actions{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;align-items:center}
.ni-actions a,.ni-actions .linkbtn,.ni-actions .cal-btn{display:inline-flex!important;align-items:center;gap:5px;padding:0!important;border:0;background:none;color:var(--electric);font-size:12.5px!important;font-weight:700;text-decoration:none;cursor:pointer}
.ni-date{flex:0 0 auto;width:56px;border-radius:16px;background:var(--night);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 9px;align-self:flex-start}
.ni-date.electric{background:var(--electric)}
.ni-date.danger{background:var(--danger)}
.ni-date-m{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}
.ni-date.electric .ni-date-m,.ni-date.danger .ni-date-m{color:rgba(255,255,255,.8)}
.ni-date-d{font-size:24px;font-weight:800;line-height:1.05;letter-spacing:-.03em}
.ni-date-w{font-size:10px;font-weight:600;color:rgba(255,255,255,.65);text-transform:capitalize}
.ni-tags{display:flex;flex-wrap:wrap;gap:6px}
.ni-tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--mist);color:var(--slate)}
.ni-tag.electric,.ni-tag.agenda-tag-grupo{background:var(--electric-50);color:var(--electric)}
.ni-tag.success,.ni-tag.agenda-tag-mesa{background:var(--success-50);color:var(--success)}
.ni-tag.warning,.ni-tag.agenda-tag-comision{background:var(--warning-50);color:var(--warning)}
.ni-tag.danger,.ni-tag.agenda-tag-pleno{background:var(--danger-50);color:var(--danger)}
.ni-tag.night{background:var(--night);color:#fff}
/* Inicio compacto */
.nh-top{background:var(--night);color:#fff}
.nh-top .wrap{padding-top:14px;padding-bottom:16px}
.nh-hello{margin:0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}
.nh-date{margin:4px 0 0;color:#fff;font-size:clamp(22px,6.6vw,30px);font-weight:900;letter-spacing:-.03em;line-height:1.08}
.nh-pleno{display:flex;align-items:center;gap:8px;margin-top:12px;padding:11px 14px;border-radius:12px;background:var(--electric);color:#fff;font-size:14px;font-weight:700;text-decoration:none}
.nh-pleno span{margin-left:auto;white-space:nowrap}
.nh-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.nh-tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;text-decoration:none;cursor:pointer;font:inherit}
.nh-tile b{font-size:21px;font-weight:800;line-height:1.1;display:flex;align-items:center;min-height:23px}
.nh-tile small{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.7);white-space:nowrap}
.nh-tile.warn b{color:#ffb4b4}
.nh-sec{padding-top:16px}
.nh-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.nh-head h2{margin:0;margin-right:auto;font-size:16px;font-weight:800;color:var(--night)}
.nh-more{border:0;background:none;color:var(--electric);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:4px 0;white-space:nowrap}
.nh-add{width:30px;height:30px;border-radius:999px;border:0;background:var(--electric);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.nh-tabs{display:inline-flex;background:#fff;border:1px solid var(--line-strong);border-radius:999px;padding:3px}
.nh-tabs button{border:0;background:none;border-radius:999px;padding:5px 10px;font:inherit;font-size:12px;font-weight:700;color:var(--slate);cursor:pointer;white-space:nowrap}
.nh-tabs button.active{background:var(--night);color:#fff}
.nh-tabs i{font-style:normal;opacity:.6}
.nh-list{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.nh-row{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 0;min-height:46px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.nh-row:first-child{border-top:0}
.nh-row.empty{padding-left:14px;color:var(--slate);font-size:13.5px}
.nh-row.past{opacity:.55}
.nh-row.pleno{background:#eef3ff}
.nh-row .check{flex:0 0 auto;margin-left:12px}
.nh-bar{flex:0 0 4px;align-self:stretch;border-radius:0 4px 4px 0}
.nh-time{flex:0 0 46px;font-size:12px;font-weight:700;color:var(--slate);line-height:1.25}
.nh-time.warn{color:var(--danger)}
.nh-title{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--night);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nh-title small{font-weight:500;color:var(--slate)}
.nh-row.pleno .nh-title{font-weight:800}
.nh-ico{flex:0 0 auto;display:flex;color:var(--electric);padding:4px}
.nh-row .cal-btn{flex:0 0 auto;display:inline-flex!important;padding:4px!important;font-size:17px!important;line-height:1;background:none;border:0;cursor:pointer}
.nh-state{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--slate);white-space:nowrap}
.nh-state.ok{color:var(--success)}
.nh-state.warn{color:var(--danger)}
@media (min-width:860px){.nh-cols{display:grid;grid-template-columns:3fr 2fr;gap:24px;align-items:start}.nh-date{font-size:40px}}
/* Iniciativas importantes */
.ni-init{position:relative}
.ni-init .ni-tags{padding-right:40px}
.ni-star{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--slate);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ni-star:hover{border-color:var(--electric);color:var(--electric)}
.ni-star.on{background:#ffb800;border-color:#ffb800;color:#fff}
.ni-init.imp{border-color:#ffb800;box-shadow:0 0 0 1px #ffb800 inset}
.ni-tag.star{background:#fff4d1;color:#9a6a00}
/* Plenos: tarjeta destacada y enlace fijo al orden del día */
.ni-event.pleno{position:relative;overflow:hidden;background:var(--night);border-color:var(--night);color:#fff;box-shadow:0 14px 34px -18px rgba(7,19,48,.75);padding:20px}
.ni-event.pleno:before{content:'';position:absolute;right:-70px;top:-70px;width:200px;height:200px;border-radius:50%;background:rgba(30,91,255,.35);filter:blur(40px);pointer-events:none}
.ni-event.pleno>*{position:relative}
.ni-grid.two>.ni-event.pleno{grid-column:1/-1}
.ni-event.pleno .ni-date{background:var(--electric)}
.ni-event.pleno .ni-date-m{color:#fff}
.ni-event.pleno h3{color:#fff;font-size:19px}
.ni-event.pleno .ni-event-detail,.ni-event.pleno .ni-meta{color:rgba(255,255,255,.72)}
.ni-event.pleno .ni-tag{background:rgba(255,255,255,.12);color:#fff}
.ni-event.pleno .ni-tag.star{background:var(--electric);color:#fff}
.ni-event.pleno .ni-actions a,.ni-event.pleno .ni-actions .linkbtn,.ni-event.pleno .ni-actions .cal-btn{color:var(--sky)}
.ni-event.pleno .ni-actions a.ni-orderbtn{color:var(--night);background:#fff;border-radius:999px;padding:9px 16px!important;font-size:13.5px!important}
.ni-event.pleno .ni-actions a.ni-orderbtn:hover{background:var(--sky)}
.ni-orderbtn small{font-weight:600;opacity:.6}
.ni-ordertop{display:inline-flex;align-items:center;gap:6px;margin-left:auto;padding:7px 12px;border-radius:999px;background:var(--electric);color:#fff;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}
.ni-ordertop:hover{background:#3a70ff}
.ni-ordertop .long{display:none}
@media (min-width:860px){.ni-ordertop .long{display:inline}.ni-ordertop .short{display:none}}
.ni-pleno{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:16px;max-width:520px;padding:16px;border-radius:18px;background:var(--electric);color:#fff}
.ni-pleno .txt{flex:1;min-width:200px}
.ni-pleno small{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.ni-pleno b{display:block;margin-top:3px;font-size:16px;line-height:1.3}
.ni-pleno a{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;background:#fff;color:var(--night);font-size:13.5px;font-weight:700;text-decoration:none}

.ni-empty{border:1px dashed var(--line-strong);border-radius:var(--radius-card);padding:26px 20px;text-align:center;color:var(--slate);background:rgba(255,255,255,.5)}
.ni-empty b{display:block;color:var(--night);font-size:15px;margin-bottom:4px}
.ni-daylabel{margin:22px 0 10px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--slate)}
.ni-daylabel.today{color:var(--electric)}

/* Filtros */
.ni-filters{display:grid;gap:12px;margin:18px 0 6px}
.ni-chips{display:flex;flex-wrap:wrap;gap:6px}
.ni-chips::-webkit-scrollbar{display:none}
.ni-chip{flex:0 0 auto;border:1px solid var(--line-strong);background:#fff;color:var(--slate);border-radius:999px;padding:8px 12px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.ni-chip:hover{border-color:rgba(7,19,48,.4);color:var(--night)}
.ni-chip.active{background:var(--night);border-color:var(--night);color:#fff}
.ni-chip .n{margin-left:6px;opacity:.6}
.ni-filter-label{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--slate);margin-bottom:-4px}
.ni-seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:4px}
.ni-seg button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--slate);cursor:pointer}
.ni-seg button.active{background:var(--electric);color:#fff}
.ni-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

async function verifyOutbox(){

  const kinds=new Set(pending.map(x=>x.kind)),fresh={};
  await Promise.all([
   kinds.has('task')?loadRemoteTasks().then(v=>{fresh.tasks=v}).catch(()=>{}):null,
   kinds.has('dismissal')?loadRemoteDismissals().then(v=>{if(Array.isArray(v))fresh.dismissals=new Set(v.filter(x=>x&&x.tipo&&x.item_id).map(x=>String(x.tipo).toLowerCase()+':'+String(x.item_id)))}).catch(()=>{}):null,
   kinds.has('importante')?loadRemoteImportantes().then(v=>{fresh.importantes=v}).catch(()=>{}):null,
   kinds.has('event')?loadAgendaFromSheet().then(v=>{fresh.agenda=v}).catch(()=>{}):null
  ]);
  if(session!==who)return;
  const now=Date.now();let list=readOutbox();
  for(const e of pending){
   const ok=outboxEntryConfirmed(e,fresh);
   if(ok===true){list=list.filter(x=>x.uid!==e.uid);resolveOutboxWaiter(e.uid,true);continue}
   if(ok===null)continue; // no se pudo leer el Excel: se vuelve a comprobar más tarde
   const wait=(e.op==='create'||e.createPayload)?30000:12000;
   if(now-e.sentAt<wait)continue;

   if(cur.tries>=OUTBOX_MAX_TRIES){cur.failed=true;resolveOutboxWaiter(e.uid,false);continue}
   const found=e.kind==='task'?(fresh.tasks||[]).some(t=>String(t.id)===e.target):e.kind==='event'?(fresh.agenda||[]).some(x=>String(x.id_evento)===e.target):true;
   taskApi(e.op==='update'&&e.createPayload&&!found?{...e.createPayload,...pickCreateFields(e)}:e.payload);
   cur.tries++;cur.sentAt=now;
  }
  writeOutbox(list);
  if(Array.isArray(fresh.tasks)||fresh.dismissals)applyRemoteUserState(Array.isArray(fresh.tasks)?fresh.tasks:null,fresh.dismissals?[...fresh.dismissals].map(k=>{const i=k.indexOf(':');return {tipo:k.slice(0,i),item_id:k.slice(i+1)}}):null);
  if(Array.isArray(fresh.importantes))remoteImportantes=fresh.importantes;
  if(Array.isArray(fresh.agenda)&&fresh.agenda.length)setSourceData('agenda',fresh.agenda);

 }finally{outboxBusy=false;updateSyncBanner()}

}

// El script de Google copia el Excel en Supabase y la función de servidor "datos" lo entrega
// todo en una sola respuesta. La página no lleva ninguna clave. Si el servidor no responde o
// falta una pestaña, se lee el Excel como antes.
const DATOS_URL='https://dnukecumlmfoomqbnkuw.supabase.co/functions/v1/datos';
let contentSnapshotPromise=null,contentSnapshotAt=0;
function contentSnapshot(){
 if(contentSnapshotPromise&&Date.now()-contentSnapshotAt<5000)return contentSnapshotPromise;
 contentSnapshotAt=Date.now();
 const p=sheetFetch(DATOS_URL)
  .then(r=>{if(!r.ok)throw new Error('servidor '+r.status);return r.json()})
  .then(d=>(d&&d.contenido)||{});
 contentSnapshotPromise=p;p.catch(()=>{if(contentSnapshotPromise===p)contentSnapshotPromise=null});
 return p;
}
async function sheetRowsFor(clave,csvUrl){
 try{const snap=await contentSnapshot();const e=snap[clave];if(e&&Array.isArray(e.filas)&&e.filas.length)return e.filas.map(r=>Array.isArray(r)?r.map(v=>String(v??'')):[])}
 catch(e){console.warn('Servidor de datos no disponible, se lee el Excel',e)}
 const sep=csvUrl.includes('?')?'&':'?';
 const r=await sheetFetch(csvUrl+sep+'_='+Date.now());if(!r.ok)throw new Error(clave+' '+r.status);

}
function sheetFetch(url,timeoutMs=12000){

}

function hydrateFromCache(){let any=false;for(const s of DATA_SOURCES){if(s.cache===false)continue;const c=readDataCache(s.key);if(c){s.set(c.data);any=true}}const k=readDataCache('buzonAgendaKeys');if(k)storedBuzonAgendaKeys=new Set(k.data);return any}
function setSourceData(key,data){const s=DATA_SOURCES.find(x=>x.key===key);if(!s)return false;const before=JSON.stringify(s.get());s.set(data);if(s.cache!==false)writeDataCache(key,data);if(key==='santiCosas'||key==='albaCosas')rememberBuzonAgendaKeys();return before!==JSON.stringify(s.get())}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function withTimeout(promise,ms){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timeout de carga')),ms))])}
async function loadSourceWithRetry(s){let last;for(let i=0;i<2;i++){try{return await withTimeout(Promise.resolve().then(s.load),20000)}catch(e){last=e;if(i===0)await sleep(1500)}}throw last}
async function refreshAllData(force=false,only=null){
 if(!session?.user)return;if(dataRefreshBusy&&!only)return;
 if(!only)dataRefreshBusy=true;const who=session;
 const sources=DATA_SOURCES.filter(s=>!only||only.includes(s.key));
 try{
  await Promise.all(sources.map(async s=>{
   try{const data=await loadSourceWithRetry(s);if(session!==who)return;sourceErrors.delete(s.label);if(setSourceData(s.key,data))scheduleRender()}
   catch(e){console.warn('Fuente no disponible:',s.label,e);if(session!==who)return;const buzonAjeno=(s.key==='santiCosas'&&!isBuzonOwner('santi lopez'))||(s.key==='albaCosas'&&!isBuzonOwner('alba langarica'));if(!buzonAjeno){sourceErrors.add(s.label);updateSyncBanner()}}
  }));
 }finally{if(!only)dataRefreshBusy=false}
 if(session!==who)return;
 if(!only){const failed=[...sourceErrors];if(!failed.includes('Iniciativas')&&!failed.includes('Buzón')){startupNotificationsChecked=false;setTimeout(checkStartupNotifications,80)}}
 scheduleRender();
}

function uiBusy(){const m=document.getElementById('modal');if(m&&m.innerHTML.trim())return true;const a=document.activeElement;return !!(a&&a!==document.body&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))}
function scheduleRender(){if(!session||!firstPaintDone||renderQueued)return;renderQueued=true;setTimeout(()=>{renderQueued=false;if(!session)return;if(uiBusy()){renderPending=true;return}renderPending=false;render()},60)}
setInterval(()=>{if(renderPending&&session&&firstPaintDone&&!uiBusy()){renderPending=false;render()}},1500);
async function guardedLoadData(){
 try{
  if(taskUserEnabled()&&tasksLoadedFor!==taskKey())loadPersonalTasks();
  firstPaintDone=false;sourceErrors=new Set();
  const hadCache=hydrateFromCache();firstLoadPending=!hadCache;
  if(hadCache){firstPaintDone=true;render()}
  refreshRemoteUserState();verifyOutbox();
  const all=refreshAllData(true);
  if(!hadCache){await Promise.race([all,sleep(6000)]);firstPaintDone=true;render()}
  await all;
 }catch(e){console.error(e);firstPaintDone=true;render()}
 finally{firstLoadPending=false;updateSyncBanner()}
}
function syncBannerHTML(){
 if(!session)return '';
 const parts=[];let cls='';
 const out=myOutbox(),failed=out.filter(x=>x.failed).length,waiting=out.length-failed;
 if(firstLoadPending){parts.push('<span>Actualizando datos…</span>');cls='loading'}
 if(sourceErrors.size)parts.push(`<span>No se ha podido actualizar: <b>${esc([...sourceErrors].join(', '))}</b>. Se muestra la última copia guardada.</span><button type="button" data-sync-retry>Reintentar</button>`);
 if(failed)parts.push(`<span><b>${failed} ${failed===1?'cambio no se ha':'cambios no se han'} podido guardar</b> en el Excel.</span><button type="button" data-outbox-retry>Reintentar</button><button type="button" data-outbox-discard>Descartar</button>`);
 else if(waiting)parts.push(`<span>Guardando ${waiting} ${waiting===1?'cambio':'cambios'} en el Excel…</span>`);
 if(!parts.length)return '';
 if(!failed&&!sourceErrors.size&&waiting)cls='loading';
 return `<div class="sync-banner ${cls}">${parts.join('')}</div>`;
}
function updateSyncBanner(){
 const main=app&&app.querySelector('main');if(!main)return;
 const old=main.querySelector(':scope > .sync-banner');if(old)old.remove();
 const html=syncBannerHTML();if(!html)return;
 main.insertAdjacentHTML('afterbegin',html);
 const b=main.querySelector(':scope > .sync-banner');
 const r=b.querySelector('[data-sync-retry]');if(r)r.onclick=()=>{sourceErrors=new Set();updateSyncBanner();refreshAllData(true)};
 const o=b.querySelector('[data-outbox-retry]');if(o)o.onclick=retryFailedWrites;
 const d=b.querySelector('[data-outbox-discard]');if(d)d.onclick=()=>{if(confirm('¿Descartar los cambios que no se han podido guardar?'))discardFailedWrites()};
}

function inferArea(text,allowed=currentAreas()){const raw=normPerson(text);let best='',bestScore=0;for(const a of allowed){const keys=[normPerson(a),...(AREA_KEYWORDS[a]||[]).map(normPerson)];let score=0;for(const k of keys){if(k&&raw.includes(k))score+=k.length>12?3:k.length>6?2:1}if(score>bestScore){best=a;bestScore=score}}return best}

function initiativeLinkByTitle(title){
 const target=normPerson(String(title||'')
   .replace(/^sobre\s+/i,'')
   .replace(/^relativa?\s+a\s+/i,'')
   .replace(/^relativo\s+a\s+/i,'')
   .replace(/^en relación con\s+/i,'')
   .replace(/^en relacion con\s+/i,''));
 if(!target)return '';
 let best=null,bestScore=0;
 for(const x of initiativeItems||[]){
  const raw=normPerson(String(x.titulo||'')
    .replace(/^sobre\s+/i,'')
    .replace(/^relativa?\s+a\s+/i,'')
    .replace(/^relativo\s+a\s+/i,'')
    .replace(/^en relación con\s+/i,'')
    .replace(/^en relacion con\s+/i,''));
  if(!raw)continue;
  let score=0;
  if(raw===target)score=100;
  else if(raw.includes(target)||target.includes(raw))score=80;
  else{
   const a=new Set(target.split(/\s+/).filter(w=>w.length>4));
   const b=new Set(raw.split(/\s+/).filter(w=>w.length>4));
   const common=[...a].filter(w=>b.has(w)).length;
   const denom=Math.max(1,Math.min(a.size,b.size));
   score=(common/denom)*60;
  }
  if(score>bestScore){best=x;bestScore=score}
 }
 return bestScore>=45?(best?.enlace||''):'';
}

 return url?`<a class="initiative-link" href="${esc(url)}" target="_blank" rel="noopener">${label}</a>`:'';
}

function initiativeKindLabel(raw){
 const txt=String(raw||'').trim(),n=normPerson(txt);
 if(!n||n==='iniciativa'||n==='asignada')return 'Otras';
 if(/(^|[^a-z])pnl([^a-z]|$)/.test(n)||n.includes('proposicion no de ley'))return 'PNL';
 if(n.startsWith('mocion'))return 'Moción';
 if(n.includes('solicitud de informacion'))return 'Solicitud de información';
 if(n.includes('pregunta escrita'))return 'Pregunta escrita';
 if(n.includes('pregunta oral'))return 'Pregunta oral';
 if(n.includes('interpelacion'))return 'Interpelación';
 if(n.includes('comparecencia'))return 'Comparecencia';
 if(n.includes('proposicion de ley'))return 'Proposición de ley';
 if(n.includes('enmienda'))return 'Enmienda';

// ---- Buscador del repositorio ----
// El script de Google guarda en la pestaña Repositorio_indice la lista de documentos del
// repositorio (se actualiza una vez al día); aquí se busca en esa lista, sin esperar a Drive.
const REPO_FOLDER_URL='https://drive.google.com/drive/folders/16WkkpsQcDCGFxNqmV8bH_7JFKzJRG_Nf';
const REPO_INDEX_CSV_URL='https://docs.google.com/spreadsheets/d/1xUZ1Q7XDGQCw406Woy1imLppYszBJ9cEjk0__fmP3wU/gviz/tq?tqx=out:csv&headers=1&sheet=Repositorio_indice';
async function loadRepoIndex(){
 const r=await sheetRowsFor('repositorio',REPO_INDEX_CSV_URL);
 const rows=r;if(!rows.length)return null;
 const h=rows[0].map(x=>String(x||'').trim()),ix=n=>h.indexOf(n);
 if(ix('Título')<0||ix('Enlace')<0)return null; // la pestaña aún no existe
 return rows.slice(1).filter(r=>String(r[ix('Título')]||'').trim()).map(r=>({titulo:String(r[ix('Título')]||'').trim(),enlace:String(r[ix('Enlace')]||'').trim(),carpeta:ix('Carpeta')>=0?String(r[ix('Carpeta')]||'').trim():'',fecha:ix('Modificado')>=0?String(r[ix('Modificado')]||'').trim():'',tipo:ix('Tipo')>=0?String(r[ix('Tipo')]||'').trim():'',creado:ix('Creado')>=0?String(r[ix('Creado')]||'').trim():''}));
}
function ensureRepoLoaded(){
 if(repoLoaded||repoLoading)return;
 const cached=readDataCache('repositorio');if(cached){repoItems=cached.data;repoLoaded=true}
 repoLoading=true;
 loadRepoIndex().then(items=>{repoLoading=false;repoLoaded=true;if(items===null){repoAvailable=!!repoItems.length;scheduleRender();return}repoAvailable=true;const changed=JSON.stringify(items)!==JSON.stringify(repoItems);repoItems=items;writeDataCache('repositorio',items);if(changed)scheduleRender()})
  .catch(e=>{console.warn('Repositorio no disponible',e);repoLoading=false;repoLoaded=true;if(!repoItems.length)repoAvailable=false;scheduleRender()});
}

// La "acción necesaria" sola ("Confirmar asistencia") no dice a qué se refiere: se une al asunto.
function buzonTaskTitle(x){
 const accion=String(x.accion||'').trim().replace(/[.;:\s]+$/,''),asunto=String(x.asunto||'').trim();
 if(accion&&asunto&&!normPerson(accion).includes(normPerson(asunto)))return `${accion} — ${asunto}`;
 return accion||asunto;
}
function buzonTaskPriority(x){const p=normPerson(x.prioridad);return /alta|urgente/.test(p)?'Urgente':/baja/.test(p)?'Cuando pueda':'Pronto'}
function buzonTaskStoreKey(){return 'gpvBuzonTareas:'+notificationUserKey()}
function buzonTaskAddedIds(){try{const v=JSON.parse(localStorage.getItem(buzonTaskStoreKey())||'[]');return new Set(Array.isArray(v)?v:[])}catch(e){return new Set()}}
function markBuzonTaskAdded(id){const ids=buzonTaskAddedIds();ids.add(String(id));try{localStorage.setItem(buzonTaskStoreKey(),JSON.stringify([...ids].slice(-500)))}catch(e){}}
function buzonTaskAdded(x){return buzonTaskAddedIds().has(String(x.id))||tasks.some(t=>sourceTaskKey(t.title)===sourceTaskKey(buzonTaskTitle(x))||sourceTaskKey(t.title)===sourceTaskKey(x.accion||x.asunto))}

let buzonBulkRun=0;
async function setBuzonDismissalBulk(items,value){
 const run=++buzonBulkRun;
 for(const x of items){setLocalDismissal('buzon',x,value);const key='buzon:'+x.id;value?remoteDismissed.add(key):remoteDismissed.delete(key)}
 for(const x of items){if(run!==buzonBulkRun)return;dismissalApi(value?'descartar_item':'restaurar_descarte','buzon',x);await sleep(250)}
}

 const imp=importanteOwner(x),puede=canMarkImportante(x);
 const star=puede?`<button type="button" class="ni-star press ${imp?'on':''}" data-ni-imp="${esc(importanteKey(x))}" data-ni-imp-p="${esc(x.parlamentario||'')}" aria-pressed="${!!imp}" title="${imp?'Quitar de importantes':'Marcar como importante'}">${imp?'★':'☆'}</button>`:'';
 return `<article class="ni-card ni-init ${imp?'imp':''}">${star}<div class="ni-tags">${imp?`<span class="ni-tag star">★ Importante</span>`:''}<span class="ni-tag electric">${esc(x.tipo)}</span><span class="ni-tag ${estadoTone}">${esc(x.estado)}</span></div><h3>${esc(x.titulo)}</h3>${meta?`<div class="ni-meta">${meta}</div>`:''}${links?`<div class="ni-actions">${links}</div>`:''}</article>`;
}
function niIniciativas(){
 const data=niInitiativeData();
 const kinds=initiativeKindsIn([data.map(x=>({tipo:x.tipo}))]);
 if(niTipo!=='Todos'&&!kinds.includes(niTipo))niTipo='Todos';
 const people=[...new Set(data.map(x=>x.parlamentario).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
 if(niPersona!=='Todos'&&!people.includes(niPersona))niPersona='Todos';
 const estadoOk=x=>niEstado==='Todas'||(niEstado==='Pendientes'&&x.estado==='Pendiente')||(niEstado==='Contestadas'&&x.estado==='Contestada')||(niEstado==='Asignadas'&&x.estado==='Asignada');
 const base=data.filter(x=>(niPersona==='Todos'||x.parlamentario===niPersona)&&matchesWords([x.titulo,x.expediente,x.parlamentario,x.autor,x.tipo].join(' '),initiativeSearch));
 const byType=t=>base.filter(x=>estadoOk(x)&&(t==='Todos'||x.tipo===t)).length;
 const byEstado=e=>base.filter(x=>(niTipo==='Todos'||x.tipo===niTipo)&&(e==='Todas'||(e==='Pendientes'&&x.estado==='Pendiente')||(e==='Contestadas'&&x.estado==='Contestada')||(e==='Asignadas'&&x.estado==='Asignada'))).length;
 let list=base.filter(x=>estadoOk(x)&&(niTipo==='Todos'||x.tipo===niTipo));
 if(niOrden==='plazo')list=[...list].sort((a,b)=>(niPlazoISO(a.plazo)||'9999').localeCompare(niPlazoISO(b.plazo)||'9999'));
 else list=[...list].sort((a,b)=>(a.fuente===b.fuente?niExpNum(b)-niExpNum(a):a.fuente==='asg'?-1:1));
 const tipoChips=['Todos',...kinds].map(k=>`<button type="button" class="ni-chip press ${niTipo===k?'active':''}" data-ni-tipo="${esc(k)}">${k==='Todos'?'Todos los tipos':esc(k)}<span class="n">${byType(k)}</span></button>`).join('');
 const estados=isPrensa()?['Todas']:NI_ESTADOS;
 const estadoChips=estados.map(e=>`<button type="button" class="ni-chip press ${niEstado===e?'active':''}" data-ni-estado="${esc(e)}">${esc(e)}<span class="n">${byEstado(e)}</span></button>`).join('');
 const persona=niSeesAll()&&people.length>1?`<select class="ni-select" id="niPersona" aria-label="Parlamentario">${['Todos',...people].map(p=>`<option value="${esc(p)}" ${niPersona===p?'selected':''}>${p==='Todos'?'Todos los parlamentarios':esc(p)}</option>`).join('')}</select>`:'';
 const orden=`<div class="ni-seg" role="tablist" aria-label="Orden"><button type="button" data-ni-orden="recientes" class="${niOrden==='recientes'?'active':''}">Recientes</button><button type="button" data-ni-orden="plazo" class="${niOrden==='plazo'?'active':''}">Plazo</button></div>`;
 const impAll=data.filter(x=>importanteOwner(x)&&(niPersona==='Todos'||x.parlamentario===niPersona));
 const impKeys=new Set(impAll.map(x=>x.parlamentario+'|'+importanteKey(x)));
 list=list.filter(x=>!impKeys.has(x.parlamentario+'|'+importanteKey(x)));
 const impBlock=impAll.length?`<p class="ni-filter-label" style="margin-top:18px">★ Importantes${niSeesAll()?' · todo el grupo':''}</p><div class="ni-grid two">${impAll.map(niInitCard).join('')}</div>`:'';
 const pend=list.filter(x=>x.estado==='Pendiente').length;
 return niPageHeader(niSeesAll()?'Iniciativas · todo el grupo':'Iniciativas','Lo que hemos registrado.','Busca por título o expediente y filtra por tipo, estado y parlamentario.')+`<div class="wrap"><div class="ni-filters"><div class="ni-search">${ico('search',20)}<input id="initiativeSearch" type="search" autocomplete="off" placeholder="Buscar por título, expediente…" value="${esc(initiativeSearch)}"></div><p class="ni-filter-label">Tipo</p><div class="ni-chips">${tipoChips}</div>${estados.length>1?`<p class="ni-filter-label">Estado</p><div class="ni-chips">${estadoChips}</div>`:''}<div class="ni-row">${persona}${orden}</div></div>${impBlock}<p class="ni-count"><b>${niCount(list.length,'iniciativa','iniciativas')}</b>${pend?` · ${niCount(pend,'pendiente','pendientes')}`:''}</p>${list.length?`<div class="ni-grid two">${list.slice(0,200).map(niInitCard).join('')}</div>${list.length>200?`<p class="ni-count">Se muestran 200 de ${list.length}. Afina con la búsqueda o los filtros.</p>`:''}`:niEmpty('No hay iniciativas con estos filtros','Prueba a quitar algún filtro o cambia la búsqueda.')}</div><div style="height:16px"></div>`;
}

// ---- Asignadas ----
// PNL y mociones adjudicadas a cada parlamentario, con sus plazos (pestaña «PNL y mociones
// asignadas») y, si la iniciativa está en «Plazos enmiendas», también la Mesa, el debate y el
// plazo de enmiendas.
let asTipo='Todas',asPersona='Todos';
function niPlazosPorTitulo(){
 const rows=plazosRaw||[];if(!rows.length)return new Map();
 const h=rows[0].map(x=>String(x||'').trim()),ix=n=>h.indexOf(n),m=new Map();
 for(const r of rows.slice(1)){const t=normPerson(r[ix('Iniciativa')]||'');if(t)m.set(t,{mesa:String(r[ix('Mesa')]||'').trim(),debate:String(r[ix('Debate')]||'').trim(),enmiendas:String(r[ix('Plazo enmiendas')]||'').trim(),estado:String(r[ix('Estado')]||'').trim()})}
 return m;
}
function niAsignadasData(){
 const all=niSeesAll()||isEquipo(),plazos=niPlazosPorTitulo();
 return (assignedItems||[]).flatMap(x=>String(x.parlamentario||'').split('/').map(p=>({...x,parlamentario:canonicalGroupPerson(p.trim())})))
  .filter(x=>x.titulo&&(all||isOwnPersonLabel(x.parlamentario)))
  .map(x=>({...x,vencISO:niPlazoISO(x.vencimiento),...(plazos.get(normPerson(x.titulo))||{})}));
}
// Enlace a la ficha de la iniciativa en el Parlamento. Solo se aceptan fichas del Parlamento
// (no correos ni otras webs). Las fichas con sesión caducable se pasan al formato público.
function niFichaParlamento(url){
 const u=String(url||'').trim();
 if(!/^https?:\/\/(www\.)?legebiltzarra\.eus\//i.test(u))return '';
 const id=(u.match(/P18_ID,P18_EXPAND:(\d+)/)||u.match(/P18_ID:Y,(\d+)/)||[])[1];
 return id?`https://www.legebiltzarra.eus/ords/f?p=CTP:INICIATIVA_DETALLE::::SESSION:RESETBRCRMB,P18_ID:Y,${id}&p_lang=es`:u;
}
function niEnlaceIniciativa(x){
 const directo=niFichaParlamento(x.enlace);if(directo)return directo;
 // Si no, se busca la misma iniciativa (mismo expediente o mismo título exacto) en «Todas iniciativas».
 const exp=String(x.expediente||'').replace(/\s/g,''),tit=normPerson(x.titulo||'');
 const hit=(initiativeItems||[]).find(i=>(exp&&String(i.expediente||'').replace(/\s/g,'')===exp)||(tit&&normPerson(i.titulo||'')===tit));
 return hit?niFichaParlamento(hit.enlace):'';
}
// Color suave de la etiqueta del grupo autor.
function niPartidoClase(autor){
 const a=normPerson(autor||'');
 if(/bildu/.test(a))return 'pt-bildu';
 if(/sumar/.test(a))return 'pt-sumar';
 if(/psoe/.test(a))return 'pt-psoe';
 if(/\b(pnv|eaj|pse)\b/.test(a))return 'pt-gris';
 if(/\bvox\b/.test(a))return 'pt-vox';
 if(/\bpp\b|popular/.test(a))return 'pt-pp';
 return '';
}
function niFechaCorta(v){const iso=niPlazoISO(v);return iso?nhShortDate(iso)+' '+NI_MESES[niDate(iso).getMonth()]:String(v||'')}
function niAsigCard(x){
 const hoy=todayISO(),d=x.vencISO,dias=d?Math.round((niDate(d)-niDate(hoy))/864e5):null;
 const urg=d&&dias>=0&&dias<=3,pasada=d&&dias<0;
 const vence=x.vencimiento?`<span class="as-venc ${urg?'urg':pasada?'past':''}">${ico('clock',15)}${d?(dias===0?'Vence hoy':dias===1?'Vence mañana':pasada?'Venció el '+esc(niFechaCorta(x.vencimiento)):'Vence '+esc(niFechaCorta(x.vencimiento))):esc(x.vencimiento)}</span>`:'';
 const meta=[
  x.enmiendas?`<span>Enmiendas: <b>${esc(niPlazoISO(x.enmiendas)?niFechaCorta(x.enmiendas):x.enmiendas)}</b></span>`:'',
  x.debate?`<span>Debate: <b>${esc(x.debate)}</b></span>`:'',
  x.mesa?`<span>Mesa: ${esc(niFechaCorta(x.mesa))}</span>`:'',
  x.expediente?`<span>${esc(String(x.expediente).replaceAll('\\','/'))}</span>`:'',
  (niSeesAll()||isEquipo())&&x.parlamentario?`<span>${ico('user',14)}${esc(x.parlamentario)}</span>`:''
 ].filter(Boolean).join('');
 const url=niEnlaceIniciativa(x);
 const enlace=url?`<a href="${esc(url)}" target="_blank" rel="noopener">${ico('document',15)}Ver iniciativa</a>`:`<span class="as-nolink">Sin enlace a la ficha todavía</span>`;
 return `<article class="ni-card ni-init as-card ${urg?'urg':''} ${pasada?'past':''}"><div class="ni-tags"><span class="ni-tag electric">${esc(x.tipo||'Iniciativa')}</span>${x.autor?`<span class="ni-tag ${niPartidoClase(x.autor)}">${esc(x.autor)}</span>`:''}</div><h3>${esc(x.titulo)}</h3>${vence?`<div class="ni-meta">${vence}</div>`:''}${meta?`<div class="ni-meta as-meta">${meta}</div>`:''}${enlace?`<div class="ni-actions">${enlace}</div>`:''}</article>`;
}
function niAsignadas(){
 const data=niAsignadasData(),hoy=todayISO();
 const tipos=[...new Set(data.map(x=>x.tipo).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
 if(asTipo!=='Todas'&&!tipos.includes(asTipo))asTipo='Todas';
 const people=[...new Set(data.map(x=>x.parlamentario).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
 if(asPersona!=='Todos'&&!people.includes(asPersona))asPersona='Todos';
 const base=data.filter(x=>asPersona==='Todos'||x.parlamentario===asPersona);
 const list=base.filter(x=>asTipo==='Todas'||x.tipo===asTipo);
 // Primero las que vencen antes; las de plazo sin fecha («24 h antes del pleno»), después; las vencidas, al final.
 const rank=x=>x.vencISO?(x.vencISO>=hoy?'0'+x.vencISO:'2'+x.vencISO):'1';
 list.sort((a,b)=>rank(a).localeCompare(rank(b)));
 const chips=['Todas',...tipos].map(t=>`<button type="button" class="ni-chip press ${asTipo===t?'active':''}" data-as-tipo="${esc(t)}">${t==='Todas'?'Todos los tipos':esc(t)}<span class="n">${t==='Todas'?base.length:base.filter(x=>x.tipo===t).length}</span></button>`).join('');
 const persona=(niSeesAll()||isEquipo())&&people.length>1?`<div class="ni-row"><select class="ni-select" id="asPersona" aria-label="Parlamentario">${['Todos',...people].map(p=>`<option value="${esc(p)}" ${asPersona===p?'selected':''}>${p==='Todos'?'Todos los parlamentarios':esc(p)}</option>`).join('')}</select></div>`:'';
 const prox=list.filter(x=>x.vencISO&&x.vencISO>=hoy&&x.vencISO<=plusDaysISO(hoy,7)).length;
 return niPageHeader(niSeesAll()||isEquipo()?'Asignadas · todo el grupo':'Asignadas',(niSeesAll()||isEquipo())?'PNL y mociones del grupo.':'Tus PNL y mociones.',(niSeesAll()||isEquipo())?'Lo adjudicado a cada parlamentario, con sus plazos y enlaces.':'Lo que te han adjudicado, con sus plazos y enlaces.')+`<div class="wrap"><div class="ni-filters"><div class="ni-chips">${chips}</div>${persona}</div><p class="ni-count"><b>${niCount(list.length,'iniciativa','iniciativas')}</b>${prox?` · ${niCount(prox,'vence','vencen')} esta semana`:''}</p>${list.length?`<div class="ni-grid two">${list.map(niAsigCard).join('')}</div>`:niEmpty('No tienes iniciativas asignadas','Cuando te adjudiquen una PNL o moción aparecerá aquí.')}</div><div style="height:16px"></div>`;
}

// ---- Panel ----
// Carpeta de cada parlamentario dentro del Drive compartido GPV.
const NI_DRIVE_GPV='1CW-HXv694i1Hzl1VC2_4hfEgITHRy062';
const NI_CARPETAS={'Santi López':'10mjx-n2F5KmkZOM26QmeLxxyZ10c4ciF','Ainhoa Domaica':'1PnKeFuxC4pGTnfo4MS65uW8Pbk602pXj','Ana Morales':'1Xvaze6a0sHJ2C8sSj3GQa9a6sKH5rVwU','Muriel Larrea':'1VyvhyMTeXfoqjHNDIFWsd99WucQOMqJT','Laura Garrido':'1IDtT-HwJObbRUj8CKsPl4Gs3DtDAN4n1','Álvaro Gotxi':'1B8jw2UOrQa7ulTm0YnPopeBw4YY04gzs','Javier de Andrés':'1N6DNpf6-PFfDHSOjpbLKGmHCHrGC2L5E','Alba Langarica':'1L27aMtWIVcHJTh9P2q3BaeniAslXU27Q'};
function niMiCarpeta(){const me=currentPersonName(),c=canonicalGroupPerson(me);const id=NI_CARPETAS[c]||(Object.entries(NI_CARPETAS).find(([n])=>normPerson(n)===normPerson(me))||[])[1];return id?`https://drive.google.com/drive/folders/${id}`:''}
function niPanel(){
 const inbox=niInboxCount();
 const tile=(attr,icon,title,sub)=>{const tag=attr.startsWith('href')?'a':'button';return `<${tag}${tag==='button'?' type="button"':''} class="ni-hubitem press" ${attr}><span class="tile">${ico(icon,22)}</span><span class="txt"><b>${title}</b><small>${sub}</small></span>${ico('chevronRight',20,'chev')}</${tag}>`};
 const ext=url=>`href="${esc(url)}" target="_blank" rel="noopener"`;
 const carpeta=niMiCarpeta();
 const items=[
  carpeta?tile(ext(carpeta),'folder','Mi carpeta','Tu carpeta del Drive compartido GPV'):'',

  tile('data-tab="Radar"','radar','Radar','Noticias, BOPV y avisos del Gobierno Vasco'),
  hasGroupView()?tile('data-tab="Grupo"','users','Panel del grupo','Seguimiento de todo el grupo'):'',
  hasPendientesView()?tile('data-tab="Pendientes"','list','Pendientes','Asuntos pendientes y asignaciones'):'',
  isPrensa()?tile('data-tab="Orden"','calendar','Orden del día','Asuntos de hoy de todo el grupo'):'',
  isEquipo()?tile('data-tab="Adjudicaciones"','tasks','Adjudicaciones y plazos','PNL, mociones y vencimientos'):''
 ].filter(Boolean).join('');
 // Recursos comunes del panel de siempre: buscador del repositorio, últimos documentos,
 // banco de datos, banco de imágenes… (sin su título ni la carpeta de Santi, que ya está arriba).
 const recursos=panelGeneral().replace(/<div class="pageintro">[\s\S]*?<\/div>/,'').replace(/<div class="hubgrid" style="margin-bottom:10px">[\s\S]*?<\/a><\/div>/,'');
 return niPageHeader('Panel','Tu espacio.','Tus accesos y los recursos del grupo.')+`<div class="wrap" style="padding-top:16px"><div class="ni-hub ni-hub2">${items}</div></div>`+niLegacy(recursos)+'<div style="height:16px"></div>';
}

// ---- Acceso ----
function renderLogin(msg=''){
 app.innerHTML=`<div class="ni-login"><div class="inner"><img src="logo-ppvasco-blanco.png?v=1" alt="PP Vasco" style="display:block;height:40px;width:auto;margin-bottom:28px"><p class="eyebrow" style="color:var(--sky)">Grupo Parlamentario Popular Vasco</p><h1 class="display">Dashboard parlamentario.</h1><p>Agenda, iniciativas, radar y documentos del grupo en un solo sitio.</p><form id="loginForm"><label for="dashboardSelect">¿Quién eres?</label><select id="dashboardSelect" required><option value="" selected disabled>Elige tu perfil</option>${DASHBOARDS.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><button type="submit">Entrar</button><div id="loginError" class="error">${esc(msg)}</div></form></div></div>`;
 document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const id=document.getElementById('dashboardSelect').value;if(!id)return;if(!chooseDashboard(id,true))return;app.innerHTML='<div class="loading">Cargando…</div>';await guardedLoadData()};
}

// ---- Interacción ----
function niBind(){
 const on=(sel,fn)=>document.querySelectorAll(sel).forEach(b=>b.onclick=()=>fn(b));
 on('[data-ag-cat]',b=>{const c=b.dataset.agCat;agCats.has(c)?agCats.delete(c):agCats.add(c);render()});
 on('[data-ag-mas]',()=>{agDias+=30;render()});
 on('[data-ag-scope]',b=>{agScope=b.dataset.agScope;render()});
 on('[data-as-tipo]',b=>{asTipo=b.dataset.asTipo;render()});
 {const sel=document.getElementById('asPersona');if(sel)sel.onchange=()=>{asPersona=sel.value;render()}}
 on('[data-nh-dia]',b=>{nhDia=b.dataset.nhDia;render()});
 on('[data-in-otros]',()=>{inOtros=!inOtros;render()});
 on('[data-in-vista]',b=>{inVista=b.dataset.inVista;inMes=todayISO().slice(0,7);inDia=todayISO();render()});
 on('[data-in-dia]',b=>{inDia=inDia===b.dataset.inDia?'':b.dataset.inDia;render()});
 on('[data-in-mes]',b=>{const [y,m]=inMes.split('-').map(Number);const d=new Date(y,m-1+Number(b.dataset.inMes),1);inMes=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;inDia='';render()});
 on('[data-ag-vista]',b=>{agVista=b.dataset.agVista;agDia=null;render()});
 on('[data-ag-dia]',b=>{agDia=agDia===b.dataset.agDia?null:b.dataset.agDia;render()});
 on('[data-ag-mes]',b=>{const [y,m]=agMes.split('-').map(Number);const d=new Date(y,m-1+Number(b.dataset.agMes),1);agMes=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;agDia=null;render()});
 on('[data-ni-tipo]',b=>{niTipo=b.dataset.niTipo;render()});
 on('[data-ni-estado]',b=>{niEstado=b.dataset.niEstado;render()});
 on('[data-ni-imp]',b=>{const x=niInitiativeData().find(i=>importanteKey(i)===b.dataset.niImp&&(i.parlamentario||'')===b.dataset.niImpP);if(x)toggleImportante(x)});
 on('[data-ni-orden]',b=>{niOrden=b.dataset.niOrden;render()});
 on('[data-ni-go]',b=>{niEstado=b.dataset.niGo;niTipo='Todos';niPersona='Todos';initiativeSearch='';tab='Iniciativas';render()});
 const p=document.getElementById('niPersona');if(p)p.onchange=()=>{niPersona=p.value;render()};
}

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
if(loadStoredSession()){app.innerHTML='<div class="loading">Cargando dashboard…</div>';guardedLoadData()}else renderLogin();
})();
