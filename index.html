async function safeLoad(loader,fallback=[],timeoutMs=3500){

   new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timeout de carga')),timeoutMs))

function initiativeLinkByTitle(title){
 const target=normPerson(String(title||'')
   .replace(/^sobre\s+/i,'')
   .replace(/^relativa?\s+a\s+/i,'')
   .replace(/^relativo\s+a\s+/i,'')
   .replace(/^en relación con\s+/i,'')
   .replace(/^en relacion con\s+/i,''));
 if(!target)return '';
 let best=null,bestScore=0;
 for(const x of initiativeItems||[]){
  const raw=normPerson(String(x.titulo||'')
    .replace(/^sobre\s+/i,'')
    .replace(/^relativa?\s+a\s+/i,'')
    .replace(/^relativo\s+a\s+/i,'')
    .replace(/^en relación con\s+/i,'')
    .replace(/^en relacion con\s+/i,''));
  if(!raw)continue;
  let score=0;
  if(raw===target)score=100;
  else if(raw.includes(target)||target.includes(raw))score=80;
  else{
   const a=new Set(target.split(/\s+/).filter(w=>w.length>4));
   const b=new Set(raw.split(/\s+/).filter(w=>w.length>4));
   const common=[...a].filter(w=>b.has(w)).length;
   const denom=Math.max(1,Math.min(a.size,b.size));
   score=(common/denom)*60;
  }
  if(score>bestScore){best=x;bestScore=score}
 }
 return bestScore>=45?(best?.enlace||''):'';
}

function deadlineKey(x){

 const subject=normPerson(rawDetail.replace(/^[^:]+:\s*/,'')

   .replace(/^relativo\s+a\s+/i,'')
   .replace(/^en relación con\s+/i,'')
   .replace(/^en relacion con\s+/i,'')

   .replace(/\s+/g,' ')

}

  return `<div class="initiative"><div class="initiative-top"><h4>${esc(x.asunto)}</h4>${priority}</div>${x.resumen?`<div class="meta" style="margin-top:7px">${esc(x.resumen)}</div>`:''}${x.accion?`<div class="initiative-note"><b>Acción necesaria:</b> ${esc(x.accion)}</div>`:''}<div class="initiative-meta">${meta}</div>${x.relacionado?`<div class="meta"><b>Relacionado con:</b> ${esc(x.relacionado)}</div>`:''}${x.lugar?`<div class="meta"><b>Lugar:</b> ${esc(x.lugar)}</div>`:''}${x.observaciones?`<div class="meta">${esc(x.observaciones)}</div>`:''}${links}<div class="radar-actions"><button data-buzon-dismiss="${esc(x.id)}">✓ Descartar</button></div></div>`
 }).join(''):'<div class="empty">No hay asuntos en el buzón todavía.</div>';
 const notif='';
 return `<div class="pageintro"><h2>Buzón</h2><p>Correos, convocatorias y asuntos relevantes para ${owner}</p>${notif}</div>${card('BUZÓN',`${items.length} asuntos`,body)}`
}
function displayIdentity(){const email=(session?.user?.email||'').trim().toLowerCase();if(isPrensa())return {name:'Prensa',role:'PRENSA'};if(isEquipo())return {name:profile?.name||'Equipo',role:'EQUIPO'};if(email==='glangarica.a@legebiltzarra.eus')return {name:'Alba Langarica',role:'Administración'};if(isLaura())return {name:'Laura Garrido',role:'PORTAVOZ'};if(isJavier())return {name:profile?.name||'Javier de Andrés',role:'PARLAMENTARIO CON VISIÓN GENERAL'};const cfg=PEOPLE[email];if(cfg)return {name:cfg.name,role:'Parlamentario'};if(profile?.name){const r=profile?.role==='parlamentario'?'Parlamentario':profile?.role==='admin'?'Administración':profile?.role==='asesor'?'Asesor':(profile?.role||'Usuario');return {name:profile.name,role:r}}return {name:'Usuario',role:'Usuario'}}
function render(){if(!session)return renderLogin();const ident=displayIdentity(),name=ident.name,role=ident.role;if(isPrensa()){const tabs=[['Inicio','⌂','Inicio'],['Orden','☰','Orden del día'],['Radar','◎','Radar/BOPV'],['Panel','◉','Panel general'],['Iniciativas','▤','Iniciativas']];app.innerHTML=`<header><div class="headerline"><div class="brandline"></div><button class="logout" id="logout">Salir</button></div><h1>${esc(name)}</h1><span>${esc(role)}</span></header><main>${tab==='Inicio'?prensaInicio():tab==='Orden'?prensaOrdenDelDia():tab==='Radar'?equipoRadar():tab==='Panel'?panelGeneral():tab==='Iniciativas'?prensaIniciativas():tab==='Agenda'?agendaPage():prensaInicio()}</main><nav class="bottomnav">${tabs.map(([n,i,l])=>`<button data-tab="${n}" class="${tab===n?'active':''}"><span>${i}</span><small>${l}</small></button>`).join('')}</nav><div id="modal"></div>`;bind();return}if(isEquipo()){const tabs=[['Inicio','⌂','Inicio'],['Radar','◎','Radar/BOPV'],['Panel','◉','Panel general'],['Adjudicaciones','☑','Adjudicaciones'],['Solicitudes','▤','Solicitudes']];app.innerHTML=`<header><div class="headerline"><div class="brandline"></div><button class="logout" id="logout">Salir</button></div><h1>${esc(name)}</h1><span>${esc(role)}</span></header><main>${tab==='Inicio'?equipoInicio():tab==='Radar'?equipoRadar():tab==='Panel'?panelGeneral():tab==='Adjudicaciones'?equipoAdjudicacionesPlazos():tab==='Solicitudes'?equipoSolicitudes():tab==='Agenda'?agendaPage():equipoInicio()}</main><nav class="bottomnav">${tabs.map(([n,i,l])=>`<button data-tab="${n}" class="${tab===n?'active':''}"><span>${i}</span><small>${l}</small></button>`).join('')}</nav><div id="modal"></div>`;bind();return}const isSanti=normPerson(currentPersonName())==='santi lopez';const isAlbaUser=isAdmin()&&normPerson(currentPersonName())==='alba langarica';const lastTab=hasGroupView()?'Grupo':hasPendientesView()?'Pendientes':(isSanti||isAlbaUser)?'Buzón':'Agenda';const lastLabel=isLaura()?'Panel portavoz':isJavier()?'Panel grupo':hasPendientesView()?'Pendientes':(isSanti||isAlbaUser)?'Buzón':'Agenda';app.innerHTML=`<header><div class="headerline"><div class="brandline"></div><button class="logout" id="logout">Salir</button></div><h1>${esc(name)}</h1><span>${esc(role)}</span></header><main>${tab==='Inicio'?inicio():tab==='Radar'?radar():tab==='Panel'?panelGeneral():tab==='Grupo'?groupPanel():tab==='Pendientes'?pendientes():tab==='Buzón'?(buzonUnlocked?buzon():'<div class="soon"><h2>Buzón bloqueado</h2><p>Introduce la contraseña desde la pestaña Buzón.</p></div>'):tab==='Iniciativas'?iniciativas():tab==='Banco de Datos'?bancoDatos():tab==='Agenda'?agendaPage():`<div class="soon"><h2>${tab}</h2><p>Módulo preparado para la siguiente fase.</p></div>`}</main><nav class="bottomnav">${[['Inicio','⌂','Inicio'],['Radar','◎','Radar'],['Panel','◉','Panel general'],['Iniciativas','▤','Iniciativas'],[lastTab,'☑',lastLabel]].map(([n,i,l])=>`<button data-tab="${n}" class="${tab===n?'active':''}"><span>${i}</span><small>${l}</small></button>`).join('')}</nav><div id="modal"></div>`;bind()}
function openBuzonPassword(){
 document.getElementById('modal').innerHTML=`<div class="modal"><div class="sheet"><h2>Acceso al Buzón</h2><p class="meta" style="margin-bottom:12px">Accede al buzón introduciendo la contraseña de tu correo electrónico.</p><input id="buzonPasswordInput" type="password" inputmode="numeric" autocomplete="off" placeholder="Contraseña"><div id="buzonPasswordError" class="error"></div><div class="actions"><button class="primary" id="unlockBuzon">Entrar</button><button id="cancelBuzonUnlock">Cancelar</button></div></div></div>`;
 const input=document.getElementById('buzonPasswordInput');
 const submit=()=>{if(input.value===BUZON_PASSWORD){buzonUnlocked=true;document.getElementById('modal').innerHTML='';tab='Buzón';render()}else{document.getElementById('buzonPasswordError').textContent='Contraseña incorrecta.';input.value='';input.focus()}};
 document.getElementById('unlockBuzon').onclick=submit;
 document.getElementById('cancelBuzonUnlock').onclick=()=>document.getElementById('modal').innerHTML='';
 input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
 setTimeout(()=>input.focus(),0);
}
function bind(){
 const logout=document.getElementById('logout');
 if(logout)logout.onclick=()=>{
  buzonUnlocked=false;
  clearDashboard();
  agendaItems=[];plazoItems=[];initiativeItems=[];assignedItems=[];
  radarItems=[];bopvItems=[];accessItems=[];pendingItems=[];
  santiCosasItems=[];albaCosasItems=[];
  tab='Inicio';
  renderLogin();
 };

 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
  const target=b.dataset.tab;
  if(target==='Buzón'&&!buzonUnlocked){openBuzonPassword();return}
  tab=target;render();
 });

 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
  const target=b.dataset.go;
  if(target==='Buzón'&&!buzonUnlocked){openBuzonPassword();return}
  tab=target;render();
 });

 document.querySelectorAll('[data-bd-dep]').forEach(b=>b.onclick=()=>{
  bancoDatosDep=b.dataset.bdDep;render();
 });

 const bdSearch=document.getElementById('bdSearch');
 if(bdSearch)bdSearch.oninput=()=>{bancoDatosSearch=bdSearch.value;render()};

 document.querySelectorAll('[data-agenda-filter]').forEach(b=>b.onclick=()=>{
  const f=b.dataset.agendaFilter;
  if(agendaFilters.has(f))agendaFilters.delete(f);else agendaFilters.add(f);
  render();
 });

 document.querySelectorAll('[data-initiative-filter]').forEach(b=>b.onclick=()=>{
  initiativeFilter=b.dataset.initiativeFilter;render();
 });

 document.querySelectorAll('[data-admin-person]').forEach(s=>s.onchange=()=>{
  adminParlamentarioFilter=s.value;render();
 });

 document.querySelectorAll('[data-radar-person]').forEach(s=>s.onchange=()=>{
  radarParlamentarioFilter=s.value;render();
 });

 document.querySelectorAll('[data-group-person]').forEach(s=>s.onchange=()=>{
  groupParlamentarioFilter=s.value;render();
 });

 document.querySelectorAll('[data-home-initiative-filter]').forEach(b=>b.onclick=()=>{
  homeInitiativeFilter=b.dataset.homeInitiativeFilter;render();
 });

 document.querySelectorAll('[data-bopv-dismiss]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.bopvDismiss;
  localStorage.setItem('gpvBopvDismissed:'+id,'1');
  render();
  showToast('Asunto BOPV descartado',()=>{
   localStorage.removeItem('gpvBopvDismissed:'+id);render();showToast('Asunto restaurado');
  });
 });

 document.querySelectorAll('[data-radar-dismiss]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.radarDismiss;
  localStorage.setItem('gpvRadarDismissed:'+id,'1');
  render();
  showToast('Noticia descartada',()=>{
   localStorage.removeItem('gpvRadarDismissed:'+id);render();showToast('Noticia restaurada');
  });
 });

 document.querySelectorAll('[data-buzon-dismiss]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.buzonDismiss;
  const key=buzonDismissKey(id);
  localStorage.setItem(key,'1');
  render();
  showToast('Entrada descartada',()=>{
   localStorage.removeItem(key);render();showToast('Entrada restaurada');
  });
 });
 const miniAdd=document.getElementById('miniTaskAdd');
 if(miniAdd)miniAdd.onclick=async()=>{
  const inp=document.getElementById('miniTaskText');
  const title=inp?.value.trim();
  if(!title)return;
  const item={id:Date.now(),title};
  miniTasks.push(item);
  miniSaveTasks();
  render();
  const ok=await miniSendTask(item);
  showToast(ok?'Tarea enviada al Excel':'No se pudo enviar al Excel');
 };

}

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
if(loadStoredSession()){app.innerHTML='<div class="loading">Cargando dashboard…</div>';guardedLoadData()}else renderLogin();
})();
</script></body></html>
